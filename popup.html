<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>墨匣 · 对话导出</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <svg class="seal" viewBox="0 0 44 44" width="40" height="40" aria-hidden="true">
          <rect x="1" y="1" width="42" height="42" rx="12" fill="#111111" />
          <rect x="1.6" y="1.6" width="40.8" height="40.8" rx="11.4" fill="none" stroke="#5a5a5a" stroke-opacity=".7" />
          <rect x="11" y="9" width="19" height="25" rx="2.6" fill="#f4f4f4" />
          <path d="M16 16h9M16 20h9M16 24h5" stroke="#8c8c8c" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="30.5" cy="30.5" r="7.6" fill="#f4f4f4" stroke="#111111" stroke-width="1.4" />
          <path d="M30.5 26.4v7.4M27.6 30.5l2.9 2.9 2.9-2.9" fill="none" stroke="#111111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-copy">
          <span class="brand-name">墨匣</span>
          <span class="brand-tagline">把对话，收进匣子</span>
        </span>
      </header>

      <section class="panel" aria-label="导出选项">
        <div class="format" role="group" aria-label="导出格式">
          <span class="field-label">导出格式</span>
          <label class="format-option">
            <input type="radio" name="exportFormat" value="markdown" checked />
            <span class="format-box">
              <span class="format-dot" aria-hidden="true"></span>
              <span class="format-copy">
                <span class="format-name">Markdown</span>
              </span>
            </span>
          </label>
          <label class="format-option">
            <input type="radio" name="exportFormat" value="json" />
            <span class="format-box">
              <span class="format-dot" aria-hidden="true"></span>
              <span class="format-copy">
                <span class="format-name">JSON</span>
              </span>
            </span>
          </label>
        </div>

        <label class="switch-row">
          <span class="switch-copy">
            <span class="switch-title">只导出我的提问</span>
            <span class="switch-note">跳过 AI 回复，只留下自己的问题</span>
          </span>
          <input id="userOnly" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <section class="export" aria-label="导出操作">
        <button id="exportButton" class="btn-primary" type="button">
          <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
            <path d="M10 2.5v9M6.4 8.2 10 11.8l3.6-3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3.5 13.5v2a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span id="exportButtonLabel">导出 Markdown</span>
        </button>
        <button id="stopExport" class="btn-stop" type="button" disabled>停止导出</button>
      </section>

      <details class="advanced">
        <summary><span>高级设置</span><small>接口分页</small></summary>
        <section class="settings" aria-label="接口分页设置">
          <p class="settings-note">以下设置只对豆包生效；DeepSeek 一次读取整个会话。</p>
          <label>
            <span>接口页数</span>
            <input id="maxApiPages" type="number" min="1" max="5000" step="1" value="1000" />
          </label>
          <label>
            <span>每页条数</span>
            <input id="apiPageSize" type="number" min="1" max="50" step="1" value="20" />
          </label>
          <label class="settings-wide">
            <span>起始 Anchor</span>
            <input id="apiStartAnchor" type="number" min="0" step="1" placeholder="自动" />
          </label>
        </section>
      </details>

      <section class="status-card" aria-label="导出状态">
        <p id="status" role="status">等待导出</p>
        <p id="detail"></p>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      </section>

      <footer class="foot">
        <p class="foot-note">本地生成文件 · 不上传对话内容</p>
        <p class="promo">QQ 交流群：225364948</p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
